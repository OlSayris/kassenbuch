<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14181d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kassenbuch">
<title>Kassenbuch</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='96' fill='%230f766e'/%3E%3Ctext x='256' y='345' font-size='280' text-anchor='middle' fill='white' font-family='Arial,sans-serif' font-weight='700'%3E%E2%82%AC%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" id="touchIcon">
<style>
  /* ---------- Farben (Hell/Dunkel folgt dem System) ---------- */
  :root { --bg:#f4f6f8; --card:#fff; --fg:#16202a; --mut:#6b7785; --line:#e3e7eb;
          --acc:#0f766e; --in:#15803d; --out:#16202a; --red:#dc2626; --bar:#0f766e; color-scheme:light dark; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14181d; --card:#1d232a; --fg:#e8edf2; --mut:#8b97a5; --line:#2b333c;
            --acc:#2dd4bf; --in:#4ade80; --out:#e8edf2; --red:#f87171; --bar:#2dd4bf; }
  }
  * { box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent; }
  body { font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--fg);
         padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(96px + env(safe-area-inset-bottom)) env(safe-area-inset-left);
         overflow-x:hidden; }
  button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; min-height:44px; min-width:44px; }
  main { max-width:560px; margin:0 auto; padding:0 16px; }
  .card { background:var(--card); border-radius:16px; padding:16px; margin-bottom:12px; }
  .mut { color:var(--mut); font-size:.85rem; }
  .neg { color:var(--red) !important; }
  /* ---------- Kopf mit Monatswechsel ---------- */
  header { display:flex; align-items:center; justify-content:space-between; padding:8px 0; }
  header h1 { font-size:1.15rem; font-weight:600; }
  header button { font-size:1.6rem; border-radius:50%; }
  /* ---------- Übersicht ---------- */
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px 12px; }
  .grid b { display:block; font-size:1.1rem; }
  .big b { font-size:1.6rem; }
  .in { color:var(--in); }
  .track { height:8px; background:var(--line); border-radius:4px; overflow:hidden; margin-top:6px; }
  .fill { height:100%; background:var(--bar); border-radius:4px; }
  .over .fill { background:var(--red); }
  .cat { margin-top:10px; }
  .cat .row { display:flex; justify-content:space-between; font-size:.9rem; }
  /* ---------- Buchungsliste ---------- */
  ul { list-style:none; padding:0; }
  li { display:flex; align-items:center; gap:10px; padding:6px 0; border-top:1px solid var(--line); }
  li:first-child { border-top:0; }
  li .ico { font-size:1.4rem; width:32px; text-align:center; }
  li .txt { flex:1; min-width:0; }
  li .txt div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  li .amt { font-weight:600; white-space:nowrap; }
  li .del { color:var(--mut); font-size:1.2rem; }
  /* ---------- Footer & FAB ---------- */
  footer { display:flex; flex-wrap:wrap; justify-content:center; gap:4px; padding:8px 0; }
  footer button { color:var(--acc); padding:0 10px; }
  #version { width:100%; text-align:center; }
  .fab { position:fixed; right:calc(20px + env(safe-area-inset-right)); bottom:calc(20px + env(safe-area-inset-bottom));
         width:64px; height:64px; border-radius:50%; background:var(--acc); color:#fff; font-size:2.2rem;
         box-shadow:0 4px 14px rgba(0,0,0,.25); }
  @media (prefers-color-scheme: dark) { .fab { color:#06302c; } }
  /* ---------- Eingabe-Sheet ---------- */
  dialog { border:0; padding:16px 16px calc(16px + env(safe-area-inset-bottom)); width:100%; max-width:560px;
           margin:auto auto 0; border-radius:20px 20px 0 0; background:var(--card); color:var(--fg); max-height:92vh; }
  dialog::backdrop { background:rgba(0,0,0,.45); }
  .seg { display:flex; background:var(--bg); border-radius:12px; padding:3px; gap:3px; margin-bottom:10px; }
  .seg button { flex:1; border-radius:9px; font-size:.9rem; }
  .seg button.on { background:var(--card); font-weight:600; box-shadow:0 1px 3px rgba(0,0,0,.15); }
  input { font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:12px;
          padding:10px 12px; min-height:44px; width:100%; }
  #amount { font-size:2rem; font-weight:600; text-align:right; margin-bottom:10px; }
  .two { display:flex; gap:8px; margin-bottom:10px; }
  .two > * { flex:1; min-width:0; }
  .tiles { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .tiles button { background:var(--bg); border-radius:14px; min-height:68px; font-size:.8rem; display:flex;
                  flex-direction:column; align-items:center; justify-content:center; padding:4px; }
  .tiles button span { font-size:1.5rem; }
  .tiles button:active { background:var(--line); }
  .shake { animation:shake .3s; border-color:var(--red); }
  @keyframes shake { 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  /* ---------- Hinweis-Toast ---------- */
  #toast { position:fixed; left:50%; top:calc(12px + env(safe-area-inset-top)); transform:translate(-50%,-150%);
           background:var(--fg); color:var(--bg); padding:10px 16px; border-radius:12px; transition:transform .3s;
           font-size:.9rem; max-width:90vw; z-index:9; }
  #toast.show { transform:translate(-50%,0); }
</style>
</head>
<body>
<main id="main">
  <header>
    <button id="prev" aria-label="Vorheriger Monat">‹</button>
    <h1 id="month"></h1>
    <button id="next" aria-label="Nächster Monat">›</button>
  </header>

  <section class="card">
    <div class="grid">
      <div><span class="mut">Einnahmen</span><b class="in" id="sumIn"></b></div>
      <div><span class="mut">Ausgaben</span><b id="sumOut"></b></div>
      <div class="big"><span class="mut">Saldo Monat</span><b id="saldo"></b></div>
      <div class="big"><span class="mut">Kassenstand</span><b id="stand"></b></div>
    </div>
    <div id="budget" class="cat"></div>
  </section>

  <section class="card" id="cats"></section>
  <section class="card"><ul id="list"></ul></section>

  <footer>
    <button id="btnBudget">Budget</button>
    <button id="btnExport">Export</button>
    <button id="btnImport">Import</button>
    <input type="file" id="file" accept="application/json,.json" hidden>
    <div class="mut" id="version">Version –</div>
  </footer>
</main>

<button class="fab" id="fab" aria-label="Buchung erfassen">+</button>

<dialog id="sheet">
  <div class="seg" id="typeSeg">
    <button data-type="out" class="on">Ausgabe</button>
    <button data-type="in">Einnahme</button>
  </div>
  <input id="amount" inputmode="decimal" placeholder="0,00 €" autocomplete="off" aria-label="Betrag">
  <div class="two">
    <input id="date" type="date" aria-label="Datum">
    <input id="note" placeholder="Notiz (optional)" maxlength="80" aria-label="Notiz">
  </div>
  <div class="seg" id="repSeg">
    <button data-rep="none" class="on">Einmalig</button>
    <button data-rep="monthly">Monatl.</button>
    <button data-rep="quarterly">Viertelj.</button>
    <button data-rep="yearly">Jährlich</button>
  </div>
  <p class="mut" style="margin-bottom:8px">Kategorie antippen = speichern</p>
  <div class="tiles" id="tiles"></div>
</dialog>

<div id="toast" role="status"></div>

<script>
"use strict";
/* ================= Konstanten ================= */
const KEY = "kassenbuch", SCHEMA = 2;
const CATS = {
  out: { Wohnen:"🏠", Lebensmittel:"🛒", "Mobilität":"🚗", Freizeit:"🎉", Abos:"📺", Versicherung:"🛡️", Sonstiges:"📦" },
  in:  { Gehalt:"💼", Nebenjob:"🧰", Erstattung:"↩️", Geschenk:"🎁", Sonstiges:"💶" },
};
const STEP = { none:0, monthly:1, quarterly:3, yearly:12 };   // Abstand in Monaten
const REP_LABEL = { monthly:"monatlich", quarterly:"vierteljährlich", yearly:"jährlich" };
const eur = new Intl.NumberFormat("de-DE", { style:"currency", currency:"EUR" });
const $ = (s) => document.querySelector(s);

/* ================= Hilfsfunktionen ================= */
const fmt = (cents) => eur.format(cents / 100);
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
// Monate als fortlaufende Zahl (Jahr*12 + Monat 0–11) – macht Rechnen und Vergleichen einfach
const monthIdx = (iso) => +iso.slice(0, 4) * 12 + (+iso.slice(5, 7) - 1);
const monthLabel = (t) => new Date(Math.floor(t / 12), t % 12, 1).toLocaleDateString("de-DE", { month:"long", year:"numeric" });
const toIso = (t, day) => {
  const y = Math.floor(t / 12), m = t % 12, last = new Date(y, m + 1, 0).getDate();
  return `${y}-${String(m + 1).padStart(2, "0")}-${String(Math.min(day, last)).padStart(2, "0")}`;
};

/** Betrag parsen: "12,5", "12.50", "1.234,56" → Cent (Integer) oder NaN */
function parseAmount(str) {
  let s = String(str).trim().replace(/[€\s]/g, "");
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  const v = Number(s);
  return s && isFinite(v) && v > 0 ? Math.round(v * 100) : NaN;
}

/* ================= Daten & Migration ================= */
/** Bringt einen Datensatz beliebiger Schema-Version auf die aktuelle Version. */
function migrateEntry(e) {
  let r = { ...e };
  if (!r.schemaVersion || r.schemaVersion < 2) {
    // v1: nur Ausgaben, Betrag in Euro (Kommazahl), keine Wiederholung
    r = { id:r.id || uid(), type:"out", amount:Math.round(Number(r.amount) * 100), cat:r.cat || "Sonstiges",
          note:r.note || "", date:r.date || today(), repeat:"none", end:null, schemaVersion:2 };
  }
  // Hier künftige Schritte ergänzen: if (r.schemaVersion < 3) { … r.schemaVersion = 3; }
  return r;
}
/** Prüft einen Datensatz (wichtig beim Import fremder Dateien). */
const isValid = (e) => e && (e.type === "in" || e.type === "out") && Number.isInteger(e.amount) && e.amount > 0
  && /^\d{4}-\d{2}-\d{2}$/.test(e.date) && e.repeat in STEP && (e.end === null || /^\d{4}-\d{2}$/.test(e.end));

function migrate(raw) {
  const list = Array.isArray(raw) ? raw : (raw && Array.isArray(raw.entries) ? raw.entries : []);
  const budget = raw && Number.isInteger(raw.budget) && raw.budget > 0 ? raw.budget : 0;
  return { entries: list.map(migrateEntry).filter(isValid), budget };
}
function load() {
  try { return migrate(JSON.parse(localStorage.getItem(KEY) || "{}")); }
  catch { return { entries: [], budget: 0 }; }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify({ schemaVersion: SCHEMA, ...state })); }
  catch { toast("Speichern fehlgeschlagen – Speicher voll?"); }
}

let state = load();
let cur = monthIdx(today());   // angezeigter Monat
let form = { type: "out", repeat: "none" };

/* ================= Wiederkehrende Buchungen ================= */
/** Wie oft fällt eine Buchung im Zeitraum Start…bis Monat t (einschließlich) an? */
function countUntil(e, t) {
  const s = monthIdx(e.date);
  if (e.repeat === "none") return s <= t ? 1 : 0;
  const last = Math.min(t, e.end ? monthIdx(e.end + "-01") : t);
  return last < s ? 0 : Math.floor((last - s) / STEP[e.repeat]) + 1;
}
/** Fällt die Buchung genau im Monat t an? */
const occursIn = (e, t) => countUntil(e, t) - countUntil(e, t - 1) > 0;
const signed = (e) => (e.type === "in" ? e.amount : -e.amount);

/* ================= Darstellung ================= */
function render() {
  const items = state.entries.filter((e) => occursIn(e, cur))
    .map((e) => ({ ...e, day: toIso(cur, +e.date.slice(8)) }))
    .sort((a, b) => b.day.localeCompare(a.day));
  const sumIn = items.filter((e) => e.type === "in").reduce((s, e) => s + e.amount, 0);
  const sumOut = items.filter((e) => e.type === "out").reduce((s, e) => s + e.amount, 0);
  const stand = state.entries.reduce((s, e) => s + signed(e) * countUntil(e, cur), 0);

  $("#month").textContent = monthLabel(cur);
  $("#sumIn").textContent = fmt(sumIn);
  $("#sumOut").textContent = fmt(sumOut);
  setMoney("#saldo", sumIn - sumOut);
  setMoney("#stand", stand);
  renderBudget(sumOut);
  renderCats(items, sumOut);
  renderList(items);
}
function setMoney(sel, cents) {
  const el = $(sel);
  el.textContent = fmt(cents);
  el.classList.toggle("neg", cents < 0);
}
function renderBudget(sumOut) {
  const b = state.budget, el = $("#budget");
  if (!b) { el.innerHTML = ""; return; }
  const rest = b - sumOut, pct = Math.min(100, (sumOut / b) * 100);
  el.className = "cat" + (rest < 0 ? " over" : "");
  el.innerHTML = `<div class="row"><span>Budget ${fmt(b)}</span><span class="${rest < 0 ? "neg" : ""}">`
    + `${rest < 0 ? "überschritten um " + fmt(-rest) : "übrig " + fmt(rest)}</span></div>`
    + `<div class="track"><div class="fill" style="width:${pct}%"></div></div>`;
}
function renderCats(items, sumOut) {
  const per = {};
  items.filter((e) => e.type === "out").forEach((e) => { per[e.cat] = (per[e.cat] || 0) + e.amount; });
  const rows = Object.entries(per).sort((a, b) => b[1] - a[1]);
  const max = rows.length ? rows[0][1] : 1;
  $("#cats").hidden = !rows.length;
  $("#cats").innerHTML = `<div class="mut">Ausgaben nach Kategorie</div>` + rows.map(([c, v]) =>
    `<div class="cat"><div class="row"><span>${CATS.out[c] || "📦"} ${esc(c)}</span><span>${fmt(v)} · ${Math.round(v / sumOut * 100)} %</span></div>`
    + `<div class="track"><div class="fill" style="width:${(v / max) * 100}%"></div></div></div>`).join("");
}
function renderList(items) {
  $("#list").innerHTML = items.length ? items.map((e) => {
    const ico = (CATS[e.type][e.cat]) || "📦";
    const rep = e.repeat !== "none" ? ` · ↻ ${REP_LABEL[e.repeat]}` : "";
    const date = new Date(e.day).toLocaleDateString("de-DE", { day:"2-digit", month:"2-digit" });
    return `<li><span class="ico">${ico}</span><div class="txt"><div>${esc(e.note || e.cat)}</div>`
      + `<div class="mut">${date} · ${esc(e.cat)}${rep}</div></div>`
      + `<span class="amt ${e.type === "in" ? "in" : ""}">${e.type === "in" ? "+" : "−"}${fmt(e.amount)}</span>`
      + `<button class="del" data-id="${esc(e.id)}" aria-label="Löschen">✕</button></li>`;
  }).join("") : `<li class="mut">Keine Buchungen in diesem Monat.</li>`;
}

/* ================= Monatswechsel (Pfeile + Wischen) ================= */
const go = (d) => { cur += d; render(); };
$("#prev").onclick = () => go(-1);
$("#next").onclick = () => go(1);
let touch = null;
$("#main").addEventListener("touchstart", (e) => { touch = e.touches[0]; }, { passive: true });
$("#main").addEventListener("touchend", (e) => {
  if (!touch) return;
  const dx = e.changedTouches[0].clientX - touch.clientX, dy = e.changedTouches[0].clientY - touch.clientY;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
  touch = null;
});

/* ================= Löschen ================= */
$("#list").addEventListener("click", (ev) => {
  const btn = ev.target.closest(".del");
  if (!btn) return;
  const e = state.entries.find((x) => x.id === btn.dataset.id);
  if (!e) return;
  const name = `„${e.note || e.cat}“ (${fmt(e.amount)})`;
  let next;
  if (e.repeat === "none" || monthIdx(e.date) === cur) {
    // Einmalig oder erster Monat einer Serie → ganz löschen
    if (!confirm(`${name} wirklich löschen?` + (e.repeat !== "none" ? "\nDie gesamte Serie wird entfernt." : ""))) return;
    next = state.entries.filter((x) => x.id !== e.id);
  } else {
    // Serie ab diesem Monat beenden, frühere Monate bleiben im Kassenbuch
    if (!confirm(`Wiederkehrende Buchung ${name} ab ${monthLabel(cur)} beenden?\nFrühere Monate bleiben erhalten.`)) return;
    const end = toIso(cur - 1, 1).slice(0, 7);
    next = state.entries.map((x) => (x.id === e.id ? { ...x, end } : x));
  }
  state = { ...state, entries: next };
  save(); render();
});

/* ================= Erfassen ================= */
function setSeg(segSel, attr, value) {
  document.querySelectorAll(`${segSel} button`).forEach((b) => b.classList.toggle("on", b.dataset[attr] === value));
}
function renderTiles() {
  $("#tiles").innerHTML = Object.entries(CATS[form.type])
    .map(([c, i]) => `<button data-cat="${c}"><span>${i}</span>${c}</button>`).join("");
}
function openSheet() {
  form = { type: "out", repeat: "none" };
  setSeg("#typeSeg", "type", "out"); setSeg("#repSeg", "rep", "none"); renderTiles();
  $("#amount").value = ""; $("#note").value = "";
  // Datum: heute, oder der 1. des angezeigten Monats, falls ein anderer Monat offen ist
  $("#date").value = monthIdx(today()) === cur ? today() : toIso(cur, 1);
  $("#sheet").showModal();
  $("#amount").focus();
}
$("#fab").onclick = openSheet;
$("#sheet").addEventListener("click", (e) => { if (e.target === e.currentTarget) e.currentTarget.close(); }); // Tipp auf Hintergrund
$("#typeSeg").onclick = (e) => {
  const b = e.target.closest("button"); if (!b) return;
  form = { ...form, type: b.dataset.type }; setSeg("#typeSeg", "type", form.type); renderTiles();
};
$("#repSeg").onclick = (e) => {
  const b = e.target.closest("button"); if (!b) return;
  form = { ...form, repeat: b.dataset.rep }; setSeg("#repSeg", "rep", form.repeat);
};
$("#tiles").onclick = (e) => {
  const b = e.target.closest("button"); if (!b) return;
  const amount = parseAmount($("#amount").value), date = $("#date").value || today();
  if (isNaN(amount)) {
    const a = $("#amount"); a.classList.remove("shake"); void a.offsetWidth; a.classList.add("shake"); a.focus();
    return;
  }
  const entry = { id: uid(), type: form.type, amount, cat: b.dataset.cat, note: $("#note").value.trim(),
                  date, repeat: form.repeat, end: null, schemaVersion: SCHEMA };
  state = { ...state, entries: [...state.entries, entry] };
  save();
  cur = monthIdx(date);
  $("#sheet").close();
  render();
  toast(`${entry.type === "in" ? "Einnahme" : "Ausgabe"} ${fmt(amount)} gespeichert`);
};

/* ================= Budget, Export, Import ================= */
$("#btnBudget").onclick = () => {
  const v = prompt("Monatsbudget für Ausgaben in € (leer lassen = kein Budget):", state.budget ? (state.budget / 100).toString().replace(".", ",") : "");
  if (v === null) return;
  const cents = parseAmount(v);
  state = { ...state, budget: isNaN(cents) ? 0 : cents };
  save(); render();
};
$("#btnExport").onclick = () => {
  const blob = new Blob([JSON.stringify({ schemaVersion: SCHEMA, ...state }, null, 2)], { type: "application/json" });
  const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(blob), download: `kassenbuch-${today()}.json` });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};
$("#btnImport").onclick = () => $("#file").click();
$("#file").onchange = async (e) => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  try {
    const data = migrate(JSON.parse(await f.text()));
    if (!confirm(`${data.entries.length} Buchungen importieren?\nDie aktuellen Daten werden dabei ersetzt.`)) return;
    state = data; save(); render(); toast("Import erfolgreich");
  } catch { toast("Datei konnte nicht gelesen werden"); }
};

/* ================= Toast ================= */
let toastTimer;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

/* ================= Icon für iOS (PNG aus Canvas, da iOS kein SVG-Icon nimmt) ================= */
(() => {
  const c = Object.assign(document.createElement("canvas"), { width: 180, height: 180 }), g = c.getContext("2d");
  g.fillStyle = "#0f766e"; g.fillRect(0, 0, 180, 180);
  g.fillStyle = "#fff"; g.font = "bold 110px Arial,sans-serif"; g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText("€", 90, 98);
  $("#touchIcon").href = c.toDataURL("image/png");
})();

/* ================= Service Worker & automatische Updates ================= */
if ("serviceWorker" in navigator) {
  const hadController = !!navigator.serviceWorker.controller;   // false beim allerersten Start
  let reloading = false;
  // Neuer SW hat übernommen → einmal neu laden (nicht beim Erststart)
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadController || reloading) return;
    reloading = true;
    sessionStorage.setItem("kb-updated", "1");
    location.reload();
  });
  navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then((reg) => {
    const check = () => reg.update().catch(() => {});            // offline: einfach ignorieren
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") check(); });
    check();
  }).catch(() => {});
  // Versionsnummer beim aktiven SW erfragen → Footer und ggf. Update-Hinweis
  navigator.serviceWorker.ready.then((reg) => {
    const ch = new MessageChannel();
    ch.port1.onmessage = (e) => {
      $("#version").textContent = "Version " + e.data;
      if (sessionStorage.getItem("kb-updated")) {
        sessionStorage.removeItem("kb-updated");
        toast("App aktualisiert auf Version " + e.data);
      }
    };
    reg.active.postMessage("version", [ch.port2]);
  });
}

render();
</script>
</body>
</html>
